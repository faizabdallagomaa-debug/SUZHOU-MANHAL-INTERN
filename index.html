  const _w=new V(),_c=new V(),_n=new V(),_k=new V();

  document.querySelectorAll("#site .sg,#site .ig,#site .stp,#site .wyg,#site .mg").forEach(g=>[...g.children].forEach((c,i)=>c.style.setProperty("--d",(i%8)*.07+"s")));

  timeline();
  if(!hero.querySelector(".scue")){const a=document.createElement("a");a.className="scue";a.href="#machines";a.setAttribute("aria-label","Scroll");hero.appendChild(a)}
  initGlobe(hero);
}
let et;const site=document.getElementById("site");
new MutationObserver(()=>{clearTimeout(et);et=setTimeout(enhance,30)}).observe(site,{childList:true,subtree:true});

const bar=document.createElement("div");bar.className="sprog";document.body.appendChild(bar);
let tk=0;addEventListener("scroll",()=>{if(tk)return;tk=requestAnimationFrame(()=>{tk=0;const m=document.documentElement.scrollHeight-innerHeight;bar.style.transform="scaleX("+(m>0?scrollY/m:0)+")";timeline();
  if(RM)return;const hx=document.querySelector("#site .hx .hxi>div:first-child");if(hx){const h=innerHeight,s=Math.min(scrollY,h);hx.style.translate="0 "+(s*.28)+"px";hx.style.opacity=String(Math.max(0,1-s/(h*.75)))}})},{passive:true});

function off(el){el.classList.remove("tl");el.style.removeProperty("--rx");el.style.removeProperty("--ry")}
addEventListener("pointermove",e=>{if(RM||!FINE.matches||document.body.classList.contains("editing"))return;
  const el=e.target.closest?e.target.closest(SEL):null;if(cur&&cur!==el){off(cur);cur=null}
  if(!el||!el.closest("#site"))return;cur=el;const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height,m=/stx|bx/.test(el.className)?3:10;
  el.classList.add("tl");el.style.setProperty("--rx",((.5-y)*m).toFixed(2)+"deg");el.style.setProperty("--ry",((x-.5)*m).toFixed(2)+"deg");el.style.setProperty("--mx",(x*100).toFixed(1)+"%");el.style.setProperty("--my",(y*100).toFixed(1)+"%")},{passive:true});
document.documentElement.addEventListener("pointerleave",()=>{if(cur){off(cur);cur=null}});
})();
</script>
</body>
</html>
